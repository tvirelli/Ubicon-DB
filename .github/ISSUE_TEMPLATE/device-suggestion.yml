name: Device suggestion
description: Suggest a device to add to the Ubicon device database
labels: ["device-suggestion"]
body:
  - type: dropdown
    id: entry_type
    attributes:
      label: Entry type
      description: >-
        A specific product has a brand and model (for example "Acme Doorbell
        Pro"). A generic device type is a brandless icon for a kind of device
        (for example a plain "IP Security Camera" or "NAS"). For a generic
        type, leave Vendor and Model blank.
      options:
        - Specific product (has a brand and model)
        - Generic device type (no brand)
    validations:
      required: true
  - type: input
    id: device_name
    attributes:
      label: Device name
      description: The friendly display name of the device or device type
      placeholder: "Acme Doorbell Pro"
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor
      description: The manufacturer or brand name. Leave blank for a generic device type.
      placeholder: "Acme"
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: Model
      description: The model name or number. Leave blank for a generic device type.
      placeholder: "DB-100"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which category best fits this device?
      options:
        - camera
        - doorbell
        - smart_lock
        - smart_plug
        - light
        - sensor
        - thermostat
        - hvac
        - speaker
        - av
        - tv
        - game_console
        - computer
        - phone
        - tablet
        - printer
        - 3d_printer
        - nas
        - network
        - appliance
        - energy
        - vehicle
        - iot_hub
        - wearable
        - other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else worth knowing (keywords, distinguishing details, etc.)
    validations:
      required: false
  - type: textarea
    id: icon
    attributes:
      label: Icon
      description: >-
        Please attach a 128×128 transparent PNG or a square SVG icon for this
        device to this issue (drag and drop the file into this box). For real
        products, a product photo on a transparent background is preferred
        (matching UniFi's own icon style). Illustrations are fine for
        custom or general-use device entries.
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: Contributor credit
      description: Name for contributor credit (optional)
      placeholder: "Jane Doe"
    validations:
      required: false
  - type: checkboxes
    id: license
    attributes:
      label: License confirmation
      options:
        - label: The icon is my own image, freely licensed, or a low-resolution manufacturer product photo used for device identification
          required: true
