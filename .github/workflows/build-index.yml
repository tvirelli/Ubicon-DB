name: Build index
on:
  push:
    branches: [main]
    paths: ['devices/**', 'icons/**', 'scripts/**']
concurrency:
  group: build-index
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Snapshot pre-build index (normalized)
        run: |
          if [ -f index.json ]; then
            node -e "const i=JSON.parse(require('fs').readFileSync('index.json','utf8'));delete i.generatedAt;require('fs').writeFileSync('/tmp/index.before.json',JSON.stringify(i));"
          else
            echo "{}" > /tmp/index.before.json
          fi
      - run: npm run build
      - name: Commit index.json if changed
        run: |
          node -e "const i=JSON.parse(require('fs').readFileSync('index.json','utf8'));delete i.generatedAt;require('fs').writeFileSync('/tmp/index.after.json',JSON.stringify(i));"
          if ! diff -q /tmp/index.before.json /tmp/index.after.json > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git pull --rebase origin main
            git push
          else
            echo "index.json unchanged (ignoring generatedAt) — nothing to commit."
          fi
